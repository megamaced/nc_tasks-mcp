version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    # New releases wait a week before Dependabot proposes them: minor and patch
    # PRs merge themselves once CI is green, so this is the window for a
    # hijacked release to be caught and yanked upstream first. Security
    # updates skip the wait.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # One PR for routine dev-tooling churn; production and major bumps stay
      # separate so they get read properly.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # The SDK defines the tool contract — take majors deliberately, not on a
      # bot's schedule.
      - dependency-name: "@modelcontextprotocol/sdk"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      # CodeQL's init and analyze steps must run the same release — either one
      # bumped alone fails on a config-version mismatch — so every action bump
      # shares one PR.
      actions:
        patterns:
          - "*"
